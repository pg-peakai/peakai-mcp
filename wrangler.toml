name = "peakai-mcp"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Bind a KV namespace for OAuth session storage.
# Create with: wrangler kv:namespace create SESSIONS
# Then paste the returned id below.
[[kv_namespaces]]
binding = "SESSIONS"
id = "43340ab514934ae1b33de9b1290cd98a"
preview_id = "86efdad3cf734466a56fc008eca6763c"

[vars]
# NOTE: temporarily kept on automation.sayf.in — build.thepeakai.com does not
# expose the lookup REST path (/webhook/extractor1 -> 404) yet. Flip to
# https://build.thepeakai.com once that endpoint is live on the new backend.
PEAKAI_API_BASE = "https://automation.sayf.in"
STUDIO_BASE = "https://studio.thepeakai.com"
NHOST_AUTH_BASE = "https://yobugvzhlfuxviaptquw.auth.ap-south-1.nhost.run"

# Secrets (set with `wrangler secret put NAME`):
#   OAUTH_SIGNING_KEY  — random 32+ byte string for signing OAuth codes/tokens
#   DEV_JWT            — (dev only) hardcoded Nhost JWT for local testing
